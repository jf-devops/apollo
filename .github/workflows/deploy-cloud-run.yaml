# Cloud Run Deployment Workflow
# This workflow deploys Apollo to Google Cloud Run based on branch pushes
#
# Branch Mapping:
# - apollo-main → apollo-production (production environment)
# - apollo-beta → apollo-beta (beta environment)
#
# Environment Variables:
# - DATABASE_URL: Points to respective Cloud SQL instance
# - WEBUI_SECRET_KEY: Security key for the application
#
# Image Source: Google Artifact Registry (europe-west1-docker.pkg.dev)

name: Deploy to Google Cloud Run

on:
  workflow_dispatch:  # Manual trigger option
  push:
    branches:
      - apollo-main  # Deploy to production
      - apollo-beta  # Deploy to beta
    tags:
      - v*  # Deploy on version tags

env:
  PROJECT_ID: apollo-463322
  REGION: europe-west1
  ARTIFACT_REGISTRY: europe-west1-docker.pkg.dev
  REPOSITORY_NAME: apollo

jobs:
  # Deploy to Beta Environment
  deploy-beta:
    if: github.ref == 'refs/heads/apollo-beta'
    runs-on: ubuntu-latest
    environment: beta
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Google Auth
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
          project_id: ${{ env.PROJECT_ID }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy apollo-beta ^
            --image=${{ env.ARTIFACT_REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY_NAME }}/apollo:apollo-beta ^
            --region=${{ env.REGION }} ^
            --platform=managed ^
            --allow-unauthenticated ^
            --port=8080 ^
            --memory=4Gi ^
            --cpu=2 ^
            --max-instances=5 ^
            --min-instances=0 ^
            --set-env-vars="DATABASE_URL=${{ secrets.BETA_DATABASE_URL }},WEBUI_SECRET_KEY=${{ secrets.WEBUI_SECRET_KEY }}" ^
            --add-cloudsql-instances=${{ env.PROJECT_ID }}:${{ env.REGION }}:apollo-beta-db ^
            --update-env-vars="DATABASE_POOL_SIZE=5,DATABASE_POOL_MAX_OVERFLOW=10,DATABASE_POOL_TIMEOUT=30,DATABASE_POOL_RECYCLE=3600"

      - name: Get service URL
        id: service-url
        run: |
          echo "url=$(gcloud run services describe apollo-beta --region=${{ env.REGION }} --format='value(status.url)')" >> $GITHUB_OUTPUT

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🚀 **Beta Deployment Complete!**
              
              Your changes have been deployed to the beta environment.
              
              **Service URL**: ${{ steps.service-url.outputs.url }}
              
              The deployment is now live and ready for testing.`
            })

  # Deploy to Production Environment
  deploy-production:
    if: github.ref == 'refs/heads/apollo-main'
    runs-on: ubuntu-latest
    environment: production
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Google Auth
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
          project_id: ${{ env.PROJECT_ID }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy apollo-production ^
            --image=${{ env.ARTIFACT_REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY_NAME }}/apollo:apollo-main ^
            --region=${{ env.REGION }} ^
            --platform=managed ^
            --allow-unauthenticated ^
            --port=8080 ^
            --memory=4Gi ^
            --cpu=2 ^
            --max-instances=10 ^
            --min-instances=1 ^
            --set-env-vars="DATABASE_URL=${{ secrets.PROD_DATABASE_URL }},WEBUI_SECRET_KEY=${{ secrets.WEBUI_SECRET_KEY }}" ^
            --add-cloudsql-instances=${{ env.PROJECT_ID }}:${{ env.REGION }}:apollo-production-db ^
            --update-env-vars="DATABASE_POOL_SIZE=10,DATABASE_POOL_MAX_OVERFLOW=20,DATABASE_POOL_TIMEOUT=30,DATABASE_POOL_RECYCLE=3600"

      - name: Get service URL
        id: service-url
        run: |
          echo "url=$(gcloud run services describe apollo-production --region=${{ env.REGION }} --format='value(status.url)')" >> $GITHUB_OUTPUT

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🎉 **Production Deployment Complete!**
              
              Your changes have been deployed to production.
              
              **Service URL**: ${{ steps.service-url.outputs.url }}
              
              The deployment is now live for all users.`
            }) 