name: Cloud Run Deployment

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Create and publish Docker images with specific build args"]
    types:
      - completed

env:
  PROJECT_ID: apollo-463322
  REGION: europe-west1
  ARTIFACT_REGISTRY: europe-west1-docker.pkg.dev
  REPOSITORY_NAME: apollo

jobs:
  deploy-beta:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'apollo-beta'
    runs-on: ubuntu-latest
    environment: beta
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Google Auth
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
          project_id: ${{ env.PROJECT_ID }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy apollo-beta \
            --image=${{ env.ARTIFACT_REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY_NAME }}/apollo:apollo-beta \
            --region=${{ env.REGION }} \
            --platform=managed \
            --allow-unauthenticated \
            --port=8080 \
            --memory=4Gi \
            --cpu=2 \
            --max-instances=5 \
            --min-instances=0 \
            --set-env-vars="DATABASE_URL=${{ secrets.BETA_DATABASE_URL }},WEBUI_SECRET_KEY=${{ secrets.WEBUI_SECRET_KEY }},DATABASE_POOL_SIZE=5,DATABASE_POOL_MAX_OVERFLOW=10,DATABASE_POOL_TIMEOUT=30,DATABASE_POOL_RECYCLE=3600" \
            --add-cloudsql-instances=${{ env.PROJECT_ID }}:${{ env.REGION }}:apollo-beta-db

      - name: Get service URL
        id: service-url
        run: |
          echo "url=$(gcloud run services describe apollo-beta --region=${{ env.REGION }} --format='value(status.url)')" >> $GITHUB_OUTPUT

  deploy-production:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'apollo-main'
    runs-on: ubuntu-latest
    environment: production
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Google Auth
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
          project_id: ${{ env.PROJECT_ID }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy apollo-production \
            --image=${{ env.ARTIFACT_REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY_NAME }}/apollo:apollo-main \
            --region=${{ env.REGION }} \
            --platform=managed \
            --allow-unauthenticated \
            --port=8080 \
            --memory=4Gi \
            --cpu=2 \
            --max-instances=10 \
            --min-instances=1 \
            --set-env-vars="DATABASE_URL=${{ secrets.PROD_DATABASE_URL }},WEBUI_SECRET_KEY=${{ secrets.WEBUI_SECRET_KEY }},DATABASE_POOL_SIZE=10,DATABASE_POOL_MAX_OVERFLOW=20,DATABASE_POOL_TIMEOUT=30,DATABASE_POOL_RECYCLE=3600" \
            --add-cloudsql-instances=${{ env.PROJECT_ID }}:${{ env.REGION }}:apollo-production-db

      - name: Get service URL
        id: service-url
        run: |
          echo "url=$(gcloud run services describe apollo-production --region=${{ env.REGION }} --format='value(status.url)')" >> $GITHUB_OUTPUT 