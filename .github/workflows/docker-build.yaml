# Docker Image Building Workflow
# This workflow automatically builds and publishes Docker images to GitHub Container Registry
# 
# Branch Naming Convention:
# - upstream: Points to openwebui-pruned (the cleaned template branch)
# - apollo-main: Production-ready code (default branch)
# - apollo-beta: Development/experimental work
# - openwebui-pruned: Cleaned template (has original open-webui as its upstream)
#
# Default Configuration: Builds only the main CPU image for efficiency
# Alternative configurations are commented out below for GPU and Ollama variants
#
# Registry: GitHub Container Registry (ghcr.io)
# Platforms: linux/amd64 (Intel/AMD) + linux/arm64 (Apple Silicon)

name: Create and publish Docker images with specific build args

on:
  workflow_dispatch:  # Manual trigger option
  push:
    branches:
      - apollo-main  # Trigger on apollo-main branch pushes (production)
      - apollo-beta  # Trigger on apollo-beta branch pushes (development)
      # Alternative trigger branches (commented out):
      # - openwebui-pruned  # Trigger on template updates
      # - upstream  # Trigger on upstream updates
    tags:
      - v*  # Trigger on version tags (releases)

env:
  REGISTRY: ghcr.io  # GitHub Container Registry
  # Alternative registries (commented out):
  # REGISTRY: docker.io  # Docker Hub
  # REGISTRY: gcr.io  # Google Container Registry

jobs:
  # Main CPU Image (Default - Always Active)
  # Standard image without GPU support, suitable for most deployments
  build-main-image:
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false  # Continue building other platforms if one fails
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
        # Alternative platform configurations (commented out):
        # include:
        #   - platform: linux/amd64
        #     runner: ubuntu-latest
        #   - platform: linux/arm64
        #     runner: ubuntu-24.04-arm
        #   - platform: linux/386
        #     runner: ubuntu-latest

    steps:
      # Step 1: Prepare image naming (GitHub Packages requires lowercase)
      - name: Set repository and image name to lowercase
        run: |
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >>${GITHUB_ENV}
          echo "FULL_IMAGE_NAME=ghcr.io/${IMAGE_NAME,,}" >>${GITHUB_ENV}
        env:
          IMAGE_NAME: '${{ github.repository }}'
        # Alternative naming schemes (commented out):
        # run: |
        #   # Custom naming for customer projects
        #   echo "IMAGE_NAME=customer-project" >>${GITHUB_ENV}
        #   echo "FULL_IMAGE_NAME=ghcr.io/company/${IMAGE_NAME}" >>${GITHUB_ENV}

      # Step 2: Prepare platform-specific variables
      - name: Prepare
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV

      # Step 3: Checkout source code
      - name: Checkout repository
        uses: actions/checkout@v4  # Latest checkout action
        # Alternative checkout options (commented out):
        # uses: actions/checkout@v3  # Older version
        # with:
        #   fetch-depth: 0  # Full history (for changelog generation)

      # Step 4: Setup QEMU for cross-platform builds
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        # Alternative QEMU configurations (commented out):
        # with:
        #   platforms: linux/amd64,linux/arm64,linux/386

      # Step 5: Setup Docker Buildx for advanced building
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        # Alternative Buildx configurations (commented out):
        # with:
        #   driver-opts: |
        #     image=moby/buildkit:latest
        #   buildkitd-flags: --debug

      # Step 6: Authenticate to container registry
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        # Alternative authentication methods (commented out):
        # with:
        #   registry: ${{ env.REGISTRY }}
        #   username: ${{ secrets.DOCKER_USERNAME }}
        #   password: ${{ secrets.DOCKER_PASSWORD }}

      # Step 7: Generate image metadata and tags
      - name: Extract metadata for Docker images (default latest tag)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.FULL_IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=git-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          flavor: |
            latest=${{ github.ref == 'refs/heads/apollo-main' }}
        # Alternative tagging strategies (commented out):
        # tags: |
        #   type=ref,event=branch
        #   type=ref,event=tag
        #   type=raw,value=stable,enable=${{ github.ref == 'refs/heads/apollo-main' }}
        #   type=raw,value=latest,enable=${{ github.ref == 'refs/heads/apollo-main' }}

      # Step 8: Setup Docker layer caching
      - name: Extract metadata for Docker cache
        id: cache-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.FULL_IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            ${{ github.ref_type == 'tag' && 'type=raw,value=apollo-main' || '' }}
          flavor: |
            prefix=cache-${{ matrix.platform }}-
            latest=false

      # Step 9: Build and push Docker image
      - name: Build Docker image (latest)
        uses: docker/build-push-action@v5
        id: build
        with:
          context: .
          push: true
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.FULL_IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=registry,ref=${{ steps.cache-meta.outputs.tags }}
          cache-to: type=registry,ref=${{ steps.cache-meta.outputs.tags }},mode=max
          build-args: |
            BUILD_HASH=${{ github.sha }}
        # Alternative build configurations (commented out):
        # with:
        #   context: .
        #   push: true
        #   platforms: ${{ matrix.platform }}
        #   labels: ${{ steps.meta.outputs.labels }}
        #   build-args: |
        #     BUILD_HASH=${{ github.sha }}
        #     USE_CUDA=true  # Enable GPU support
        #     USE_OLLAMA=true  # Enable Ollama integration

      # Step 10: Export image digest for manifest creation
      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      # Step 11: Upload digest as artifact
      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-main-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1
        # Alternative artifact configurations (commented out):
        # with:
        #   name: digests-main-${{ env.PLATFORM_PAIR }}
        #   path: /tmp/digests/*
        #   retention-days: 7  # Keep longer for debugging

