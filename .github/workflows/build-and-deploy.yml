name: Build and Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - apollo-beta
      - apollo-main

env:
  PROJECT_ID: apollo-463322
  REGION: europe-west1
  ARTIFACT_REGISTRY: europe-west1-docker.pkg.dev
  REPOSITORY_NAME: apollo
  GITHUB_REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GITHUB_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Google Artifact Registry
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
          project_id: ${{ env.PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.ARTIFACT_REGISTRY }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.GITHUB_REGISTRY }}/${{ github.repository }}
            ${{ env.ARTIFACT_REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY_NAME }}/apollo
          tags: |
            type=ref,event=branch
            type=sha,prefix=git-

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-beta:
    needs: build
    if: github.ref == 'refs/heads/apollo-beta'
    runs-on: ubuntu-latest
    environment: beta
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Google Auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
          project_id: ${{ env.PROJECT_ID }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy apollo-beta \
            --image=${{ env.ARTIFACT_REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY_NAME }}/apollo:${{ needs.build.outputs.image-tag }} \
            --region=${{ env.REGION }} \
            --platform=managed \
            --allow-unauthenticated \
            --port=8080 \
            --memory=4Gi \
            --cpu=2 \
            --max-instances=5 \
            --min-instances=0 \
            --timeout=900 \
            --set-env-vars="DATABASE_URL=${{ secrets.BETA_DATABASE_URL }},WEBUI_SECRET_KEY=${{ secrets.WEBUI_SECRET_KEY }},WEBUI_SESSION_COOKIE_SECURE=true,WEBUI_AUTH_COOKIE_SECURE=true,WEBUI_SESSION_COOKIE_SAME_SITE=strict,WEBUI_AUTH_COOKIE_SAME_SITE=strict,WEBUI_AUTH=true,WEBUI_AUTH_SIGNOUT_REDIRECT_URL=https://apollo-beta-895384348623.europe-west1.run.app/logout,WEBUI_SECURITY_HEADERS_ENABLED=true,WEBUI_HSTS_ENABLED=true,DATABASE_POOL_SIZE=5,DATABASE_POOL_MAX_OVERFLOW=10,DATABASE_POOL_TIMEOUT=30,DATABASE_POOL_RECYCLE=3600,UVICORN_WORKERS=1,WEB_LOADER_ENGINE=requests,USE_OLLAMA_DOCKER=false,USE_CUDA_DOCKER=false,BYPASS_MODEL_ACCESS_CONTROL=true" \
            --add-cloudsql-instances=${{ env.PROJECT_ID }}:${{ env.REGION }}:apollo-beta-db \
            --cpu-boost \
            --execution-environment=gen2 \
            --startup-probe="timeoutSeconds=30,periodSeconds=60,failureThreshold=10,httpGet.path=/health,httpGet.port=8080"

      - name: Get service URL
        id: service-url
        run: |
          echo "url=$(gcloud run services describe apollo-beta --region=${{ env.REGION }} --format='value(status.url)')" >> $GITHUB_OUTPUT

  deploy-production:
    needs: build
    if: github.ref == 'refs/heads/apollo-main'
    runs-on: ubuntu-latest
    environment: production
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Google Auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
          project_id: ${{ env.PROJECT_ID }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy apollo-production \
            --image=${{ env.ARTIFACT_REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY_NAME }}/apollo:${{ needs.build.outputs.image-tag }} \
            --region=${{ env.REGION }} \
            --platform=managed \
            --allow-unauthenticated \
            --port=8080 \
            --memory=4Gi \
            --cpu=2 \
            --max-instances=10 \
            --min-instances=1 \
            --timeout=900 \
            --set-env-vars="DATABASE_URL=${{ secrets.PROD_DATABASE_URL }},WEBUI_SECRET_KEY=${{ secrets.WEBUI_SECRET_KEY }},WEBUI_SESSION_COOKIE_SECURE=true,WEBUI_AUTH_COOKIE_SECURE=true,WEBUI_SESSION_COOKIE_SAME_SITE=strict,WEBUI_AUTH_COOKIE_SAME_SITE=strict,WEBUI_AUTH=true,WEBUI_AUTH_SIGNOUT_REDIRECT_URL=https://apollo-production-895384348623.europe-west1.run.app/logout,WEBUI_SECURITY_HEADERS_ENABLED=true,WEBUI_HSTS_ENABLED=true,DATABASE_POOL_SIZE=10,DATABASE_POOL_MAX_OVERFLOW=20,DATABASE_POOL_TIMEOUT=30,DATABASE_POOL_RECYCLE=3600,UVICORN_WORKERS=1,WEB_LOADER_ENGINE=requests,USE_OLLAMA_DOCKER=false,USE_CUDA_DOCKER=false,BYPASS_MODEL_ACCESS_CONTROL=true" \
            --add-cloudsql-instances=${{ env.PROJECT_ID }}:${{ env.REGION }}:apollo-production-db \
            --cpu-boost \
            --execution-environment=gen2 \
            --startup-probe="timeoutSeconds=30,periodSeconds=60,failureThreshold=10,httpGet.path=/health,httpGet.port=8080"

      - name: Get service URL
        id: service-url
        run: |
          echo "url=$(gcloud run services describe apollo-production --region=${{ env.REGION }} --format='value(status.url)')" >> $GITHUB_OUTPUT 